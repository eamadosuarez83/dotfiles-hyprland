# Estética Catppuccin Mocha a juego con Hyprland/waybar/dunst.
# Antes usaba el estilo por defecto de hyprlock (sin este archivo).

source = ~/.config/hypr/colors.conf

general {
    disable_loading_bar = true
    hide_cursor = true
    grace = 0
    no_fade_in = false
}

background {
    monitor =
    path = /usr/share/backgrounds/manjaro/beehive4k-l.png
    blur_passes = 3
    blur_size = 7
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.6
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}

# Reloj grande, centrado en el tercio superior
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M")"
    color = $text
    font_size = 90
    font_family = Hack Nerd Font
    position = 0, 150
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] echo "$(date +"%A, %d de %B")"
    color = $blue
    font_size = 18
    font_family = Hack Nerd Font
    position = 0, 60
    halign = center
    valign = center
}

label {
    monitor =
    text = $USER
    color = $lavender
    font_size = 16
    font_family = Hack Nerd Font
    position = 0, -20
    halign = center
    valign = center
}

# Campo de contraseña
input-field {
    monitor =
    size = 260, 52
    outline_thickness = 2
    dots_size = 0.26
    dots_spacing = 0.3
    dots_center = true
    outer_color = $blue
    inner_color = $surface0
    font_color = $text
    fade_on_empty = false
    placeholder_text = <span foreground="##a6adc8">Contraseña...</span>
    hide_input = false
    check_color = $mauve
    fail_color = $red
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
    capslock_color = $red
    position = 0, -90
    halign = center
    valign = center
}
